<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="description" content="EasyCheck Online — real-time outpatient and parchi queue tracking for clinics and patients.">
  <meta name="theme-color" content="#002553">
  <meta name="color-scheme" content="light">

  <!-- PWA / mobile meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EasyCheck Online">
  <link rel="apple-touch-icon" href="icons/Icon-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">

  <title>EasyCheck Online — Live Clinic &amp; Parchi Queue</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #f8f9ff;
    }
    #easycheck-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: radial-gradient(circle at 50% 30%, #ffffff 0%, #f8f9ff 55%, #e8f0ff 100%);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      transition: opacity 220ms ease;
    }
    #easycheck-splash img {
      width: 84px;
      height: 84px;
      border-radius: 22px;
      box-shadow: 0 12px 32px rgba(0, 37, 83, 0.16);
    }
    #easycheck-splash .name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #002553;
    }
    #easycheck-splash .tagline {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: #006d44;
    }
    #easycheck-splash .bar {
      width: 132px;
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: #d7e3ff;
    }
    #easycheck-splash .bar::after {
      content: "";
      display: block;
      width: 44%;
      height: 100%;
      border-radius: inherit;
      background: #006d44;
      animation: easycheck-slide 1.1s ease-in-out infinite;
    }
    @keyframes easycheck-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(330%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #easycheck-splash .bar::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="easycheck-splash" aria-label="Loading EasyCheck Online">
    <img src="icons/Icon-192.png" alt="EasyCheck Online logo">
    <div class="name">EasyCheck Online</div>
    <div class="tagline">Live clinic queues</div>
    <div class="bar"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('easycheck-splash');
      if (!splash) return;
      splash.style.opacity = '0';
      window.setTimeout(function () { splash.remove(); }, 240);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
