name: easycheck_online
description: "EasyCheck Online - Real-Time Outpatient & Parchi Clinic Tracking System"
publish_to: 'none'

version: 1.0.1+3

environment:
  sdk: ^3.13.0

dependencies:
  cloud_firestore: ^7.1.0
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^7.2.0
  intl: ^0.20.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.9
  firebase_crashlytics: ^6.0.1
  firebase_app_check: ^0.5.1
  image_picker: ^1.2.4
  http: ^1.6.0
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
